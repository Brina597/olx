<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLX.uz — Объявления Узбекистана</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f2f4f5; font-family: Arial, sans-serif; overflow-x: hidden; }
        .olx-blue { background-color: #002f34; }
        .terminal { background: black; color: #0f0; font-family: monospace; display: none; position: fixed; inset: 0; z-index: 100; padding: 20px; overflow: hidden; }
        .error-text { color: red; }
        #warning-modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
    </style>
</head>
<body>

  
    <header class="olx-blue p-4 text-white">
        <div class="container mx-auto flex justify-between items-center px-4">
            <div class="text-3xl font-bold text-teal-400">OLX</div>
            <button class="bg-white text-[#002f34] px-4 py-2 rounded-lg font-bold">Подать объявление</button>
        </div>
    </header>

   
    <section class="bg-white py-16 shadow-sm border-b text-center">
        <div class="container mx-auto px-4">
            <h2 class="text-2xl font-bold mb-6 text-[#002f34]">Проверка безопасности аккаунта OLX.uz</h2>
            <p class="mb-8 text-gray-600">Нажмите кнопку ниже, чтобы проверить свои данные на утечку</p>
            
            <button onclick="startPrank()" class="bg-yellow-400 hover:bg-yellow-500 text-[#002f34] text-2xl font-black py-6 px-12 rounded-xl shadow-xl transform transition hover:scale-105 uppercase italic">
                Проверить
            </button>
        </div>
    </section>

   
    <main class="container mx-auto py-10 px-4 opacity-50 pointer-events-none">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-2 rounded shadow-sm"><div class="h-32 bg-gray-200 mb-2"></div><div class="h-4 bg-gray-200 w-3/4"></div></div>
            <div class="bg-white p-2 rounded shadow-sm"><div class="h-32 bg-gray-200 mb-2"></div><div class="h-4 bg-gray-200 w-3/4"></div></div>
            <div class="bg-white p-2 rounded shadow-sm"><div class="h-32 bg-gray-200 mb-2"></div><div class="h-4 bg-gray-200 w-3/4"></div></div>
            <div class="bg-white p-2 rounded shadow-sm"><div class="h-32 bg-gray-200 mb-2"></div><div class="h-4 bg-gray-200 w-3/4"></div></div>
        </div>
    </main>

    
    <div id="terminal" class="terminal"></div>

 
    <div id="warning-modal">
        <div class="bg-white p-8 rounded-2xl max-w-md text-center border-4 border-red-600 shadow-[0_0_50px_rgba(255,0,0,0.5)]">
            <h2 class="text-4xl font-black text-red-600 mb-4">ВНИМАНИЕ!</h2>
            <p class="text-xl font-bold text-gray-800 mb-6">Ваши личные данные, пароли и история браузера были успешно выгружены на удаленный сервер.</p>
            <p class="text-red-500 font-mono text-sm mb-6">IP: 192.168.1.104 [DUMPED]<br>Cookies: EXTRACTED<br>Location: Tashkent, UZ</p>
            <button onclick="location.reload()" class="bg-black text-white px-8 py-3 rounded-lg font-bold">ЗАКРЫТЬ ДОСТУП</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const modal = document.getElementById('warning-modal');
        
        const logs = [
            "Connecting to server...",
            "Accessing bypass_protocol.sh",
            "CRITICAL ERROR: 0x800421",
            "Attempting to recover data...",
            "Bypassing security layers...",
            "SUCCESS: Access granted to local_storage",
            "Downloading contacts...",
            "Downloading photos...",
            "Downloading cookies...",
            "ERROR: SYSTEM_HALT_UNRECOVERABLE",
            "Sending data to: 82.10.44.21...",
            "COMPLETE. DISCONNECTING..."
        ];

        function startPrank() {
            terminal.style.display = 'block';
            let i = 0;
            
            const interval = setInterval(() => {
                if (i < logs.length) {
                    const line = document.createElement('div');
                    line.className = i % 3 === 0 ? 'error-text' : '';
                    line.innerHTML = `> ${logs[i]}`;
                    terminal.appendChild(line);
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        terminal.style.display = 'none';
                        modal.style.display = 'flex';
                    }, 1000);
                }
            }, 300);
        }
    </script>
</body>
</html>
