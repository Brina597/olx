<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLX.uz — Клон</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f2f4f5; font-family: Arial, sans-serif; }
        .olx-blue { background-color: #002f34; }
        .olx-teal { background-color: #23e5db; }
        .card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

 
    <header class="olx-blue p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-3xl font-bold tracking-tighter text-teal-400">OLX</div>
            <div class="flex items-center gap-5">
                <a href="#" class="text-sm font-bold">O'z</a>
                <button class="bg-white text-[#002f34] px-4 py-2 rounded-lg font-bold hover:bg-gray-100 transition">Подать объявление</button>
            </div>
        </div>
    </header>

 
    <div class="bg-white border-b py-8 shadow-sm">
        <div class="container mx-auto px-4 flex flex-wrap gap-1">
            <input type="text" placeholder="Что ищем?" class="flex-1 p-4 border-2 border-gray-100 rounded-l focus:outline-teal-400">
            <input type="text" placeholder="Весь Узбекистан" class="flex-1 p-4 border-2 border-gray-100 focus:outline-teal-400">
            <button class="olx-blue text-white px-10 py-4 font-bold rounded-r hover:opacity-90 transition">Поиск</button>
        </div>
    </div>

    
    <main class="container mx-auto py-10 px-4">
        <h2 class="text-2xl font-bold mb-6 text-[#002f34]">VIP-объявления</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    
            <div class="bg-white rounded overflow-hidden card cursor-pointer transition">
                <img src="https://images.unsplash.com" class="h-40 w-full object-cover">
                <div class="p-3">
                    <h3 class="text-gray-800 text-sm mb-2 truncate">iPhone 14 Pro — Срочно!</h3>
                    <p class="font-bold text-lg text-[#002f34]">11 200 000 сум</p>
                    <p class="text-xs text-gray-400 mt-4">Ташкент — Сегодня в 10:15</p>
                </div>
            </div>

             
            <div class="bg-white rounded overflow-hidden card cursor-pointer transition">
                <img src="https://images.unsplash.com" class="h-40 w-full object-cover">
                <div class="p-3">
                    <h3 class="text-gray-800 text-sm mb-2 truncate">Дом в Самарканде</h3>
                    <p class="font-bold text-lg text-[#002f34]">85 000 у.е.</p>
                    <p class="text-xs text-gray-400 mt-4">Самарканд — Вчера</p>
                </div>
            </div>

        
            <div class="bg-white rounded overflow-hidden card cursor-pointer transition">
                <img src="https://images.unsplash.com" class="h-40 w-full object-cover">
                <div class="p-3">
                    <h3 class="text-gray-800 text-sm mb-2 truncate">Диван раскладной</h3>
                    <p class="font-bold text-lg text-[#002f34]">2 500 000 сум</p>
                    <p class="text-xs text-gray-400 mt-4">Наманган — 2 часа назад</p>
                </div>
            </div>

    
            <div class="bg-white rounded overflow-hidden card cursor-pointer transition">
                <img src="https://images.unsplash.com" class="h-40 w-full object-cover">
                <div class="p-3">
                    <h3 class="text-gray-800 text-sm mb-2 truncate">Велосипед спортивный</h3>
                    <p class="font-bold text-lg text-[#002f34]">1 200 000 сум</p>
                    <p class="text-xs text-gray-400 mt-4">Бухара — 15 марта</p>
                </div>
            </div>
        </div>
    </main>

</body>
