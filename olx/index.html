<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLX.uz — Проверка аккаунта</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f2f4f5; }
        .olx-blue { background-color: #002f34; }
        #terminal { display: none; position: fixed; inset: 0; background: black; color: #0f0; padding: 20px; font-family: monospace; z-index: 100; }
        #warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <header class="olx-blue p-4 text-white flex justify-between items-center shadow-lg">
        <div class="text-3xl font-black text-teal-400">OLX</div>
        <button class="bg-white text-[#002f34] px-4 py-2 rounded font-bold">Подать объявление</button>
    </header>

    <main class="max-w-xl mx-auto mt-20 p-6 bg-white rounded-xl shadow-xl text-center">
        <h1 class="text-2xl font-bold mb-4">Безопасность OLX</h1>
        <p class="text-gray-600 mb-8">Нажмите кнопку, чтобы проверить ваш аккаунт на наличие подозрительной активности.</p>
        <button onclick="start()" class="bg-[#23e5db] text-[#002f34] text-xl font-black py-4 px-10 rounded-full shadow-lg hover:scale-105 transition-transform uppercase">
            Проверить
        </button>
    </main>

    <div id="terminal"></div>

    <div id="warning">
        <div class="bg-white p-8 rounded-2xl border-4 border-red-600 text-center max-w-sm mx-4">
            <h2 class="text-3xl font-bold text-red-600 mb-4">ОШИБКА!</h2>
            <p class="font-bold text-lg mb-4 text-gray-800">Ваши данные (пароли, фото и кэш) были успешно отправлены в архив сервера.</p>
            <p class="text-xs text-red-500 font-mono mb-6 uppercase tracking-tighter">Status: 100% Uploaded | IP: Logs Saved</p>
            <button onclick="location.reload()" class="w-full bg-black text-white py-3 rounded-lg font-bold">ОТМЕНИТЬ ПЕРЕДАЧУ</button>
        </div>
    </div>

    <script>
        function start() {
            const t = document.getElementById('terminal');
            t.style.display = 'block';
            const msgs = ["System check...", "Bypassing firewall...", "Accessing private_data...", "Downloading images...", "Sending cookies...", "DUMPING COMPLETE!"];
            let i = 0;
            const interval = setInterval(() => {
                if(i < msgs.length) {
                    t.innerHTML += `<div>> ${msgs[i]}</div>`;
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => { t.style.display = 'none'; document.getElementById('warning').style.display = 'flex'; }, 800);
                }
            }, 300);
        }
    </script>
</body>
</html>
